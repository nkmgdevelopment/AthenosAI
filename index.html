<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AthenosAI Animated Poster</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="poster">
    <div class="blob" aria-hidden="true"></div>
    <div class="column column-left">
      <p class="label">ATHENOS</p>
      <p class="subtitle">FLAT DESIGN</p>
    </div>
    <div class="column column-right">
      <p class="label">MINIMUS</p>
      <p class="subtitle">FLAT DESIGN</p>
    </div>
    <div class="stream">
      <span>ATHENOS</span>
      <span>· FLAT DESIGN ·</span>
      <span>MINIMUS</span>
      <span>· FLAT DESIGN ·</span>
      <span>ATHENOS</span>
      <span>· FLAT DESIGN ·</span>
      <span>MINIMUS</span>
      <span>· FLAT DESIGN ·</span>
    </div>
  </main>
</body>
</html>
